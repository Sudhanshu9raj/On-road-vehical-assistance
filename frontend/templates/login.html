{% extends 'base.html' %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-glow" style="width: 100%;">Login</button>
        </form>
        <div id="login-error" style="color: var(--status-rejected); margin-top: 1rem; text-align: center; display: none;"></div>
        
        <script>
            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('login-error');
                
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const data = await response.json();
                    if (response.ok) {
                        window.location.href = data.redirect;
                    } else {
                        errorEl.innerText = data.message;
                        errorEl.style.display = 'block';
                    }
                } catch (err) {
                    errorEl.innerText = "An error occurred. Please try again.";
                    errorEl.style.display = 'block';
                }
            };
        </script>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dim);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-blue);">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
